server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed Vite assets (filenames already include a content hash).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Standalone HTML pages (auth.html, dashboard.html, etc.) and the SPA root.
  # Static-only site, so no client-side router fallback needed.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Don't cache HTML — we want fresh deploys to be picked up immediately.
  location ~* \.html$ {
    expires 0;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Gzip text assets.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
